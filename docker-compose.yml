version: '3.8'
services:
  localstack:
    image: localstack/localstack:1.4
    environment:
      - SERVICES=sqs
      - DEBUG=1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  game-service:
    build: .
    image: game-service:latest
    depends_on:
      - localstack
      - mongo
    environment:
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/transactions
      - SPRING_DATA_MONGODB_HOST=mongo
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017
      - WAIT_HOSTS=localstack:4566,mongo:27017
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
